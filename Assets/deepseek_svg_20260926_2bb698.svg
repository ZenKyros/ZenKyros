<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="430"
     viewBox="0 0 1000 430"
     font-family="'JetBrains Mono', 'Fira Code', monospace">

  <defs>

    <!-- Refined Cyan Gradient -->
    <linearGradient id="ascii" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- Soft Outer Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Inner Glow for accents -->
    <filter id="pulse" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Minimal Grid -->
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#22d3ee" stroke-width="0.3" opacity="0.05"/>
    </pattern>

    <!-- Radial vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1418" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Data stream gradient -->
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

  </defs>

  <!-- ==================== BACKGROUND ==================== -->
  <rect width="1000" height="430" rx="14" fill="#0a1418"/>
  <rect width="1000" height="430" rx="14" fill="url(#grid)"/>
  <rect width="1000" height="430" rx="14" fill="url(#vignette)"/>

  <!-- ==================== OUTER BORDER ==================== -->
  <rect x="8" y="8" width="984" height="414" rx="10"
        fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.35">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ==================== TERMINAL HEADER ==================== -->
  <path d="M8 22 Q8 8 22 8 H978 Q992 8 992 22 V48 H8 Z" fill="#0d1a1f"/>
  <line x1="8" y1="48" x2="992" y2="48" stroke="#1a2f38" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="32" cy="28" r="5.5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="54" cy="28" r="5.5" fill="#febc2e" opacity="0.85"/>
  <circle cx="76" cy="28" r="5.5" fill="#28c840" opacity="0.85"/>

  <!-- Terminal title -->
  <text x="500" y="33" text-anchor="middle" font-size="11" fill="#4b6b73" letter-spacing="1.5">
    ~ / kyros / github
  </text>

  <!-- Right status -->
  <circle cx="945" cy="28" r="4" fill="#22d3ee" filter="url(#pulse)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="958" y="32" font-size="10" fill="#4b6b73" letter-spacing="1">ONLINE</text>

  <!-- ==================== PROMPT LINE ==================== -->
  <text x="35" y="80" font-size="13" fill="#22d3ee" font-weight="700">
    kyros@github
    <tspan fill="#4b6b73">:</tspan>
    <tspan fill="#0891b2">~</tspan>
    <tspan fill="#4b6b73">$</tspan>
  </text>

  <text x="195" y="80" font-size="13" fill="#7dd3fc">
    fastfetch
  </text>

  <rect x="285" y="70" width="9" height="15" fill="#22d3ee" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ==================== LEFT: ASCII ART ==================== -->
  <g transform="translate(45 125)"
     font-size="17"
     font-weight="700"
     letter-spacing="0.5"
     filter="url(#softGlow)">

    <text y="0"   fill="url(#ascii)">██╗  ██╗██╗   ██╗██████╗  ██████╗ ███████╗</text>
    <text y="24"  fill="url(#ascii)">██║ ██╔╝╚██╗ ██╔╝██╔══██╗██╔═══██╗██╔════╝</text>
    <text y="48"  fill="url(#ascii)">█████╔╝  ╚████╔╝ ██████╔╝██║   ██║███████╗</text>
    <text y="72"  fill="url(#ascii)">██╔═██╗   ╚██╔╝  ██╔══██╗██║   ██║╚════██║</text>
    <text y="96"  fill="url(#ascii)">██║  ██╗   ██║   ██║  ██║╚██████╔╝███████║</text>
    <text y="120" fill="url(#ascii)">╚═╝  ╚═╝   ╚═╝   ╚═╝  ╚═╝ ╚═════╝ ╚══════╝</text>

  </g>

  <!-- Underline divider with animated sweep -->
  <line x1="45" y1="262" x2="575" y2="262" stroke="#1a2f38" stroke-width="1"/>
  <line x1="45" y1="262" x2="180" y2="262" stroke="#22d3ee" stroke-width="1.5">
    <animate attributeName="x2" values="45;575;45" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- ==================== LEFT: STATUS PANEL ==================== -->
  <g font-size="12">
    <!-- Row 1 -->
    <circle cx="50" cy="288" r="3" fill="#22d3ee" filter="url(#pulse)"/>
    <text x="65" y="292" fill="#4b6b73" letter-spacing="0.5">SYSTEM</text>
    <text x="160" y="292" fill="#7dd3fc">ONLINE</text>

    <!-- Row 2 -->
    <circle cx="50" cy="312" r="3" fill="#0891b2"/>
    <text x="65" y="316" fill="#4b6b73" letter-spacing="0.5">MODE</text>
    <text x="160" y="316" fill="#7dd3fc">DEVELOPMENT</text>

    <!-- Row 3 -->
    <circle cx="50" cy="336" r="3" fill="#22d3ee"/>
    <text x="65" y="340" fill="#4b6b73" letter-spacing="0.5">STATUS</text>
    <text x="160" y="340" fill="#7dd3fc">LEARNING</text>

    <!-- Row 4 -->
    <circle cx="50" cy="360" r="3" fill="#0891b2"/>
    <text x="65" y="364" fill="#4b6b73" letter-spacing="0.5">FOCUS</text>
    <text x="160" y="364" fill="#7dd3fc">AI &amp; QUANTUM</text>
  </g>

  <!-- ==================== CENTER DIVIDER ==================== -->
  <line x1="600" y1="90" x2="600" y2="400" stroke="#1a2f38" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- ==================== RIGHT: INFO PANEL ==================== -->
  <g transform="translate(630 90)" font-size="12">

    <!-- Name header -->
    <text x="0" y="0" font-size="14" fill="#22d3ee" font-weight="700" letter-spacing="1.5" filter="url(#softGlow)">
      ROSHAN YADAV
    </text>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#22d3ee" stroke-width="0.8" opacity="0.4"/>

    <!-- Row: USER -->
    <text x="0" y="38" fill="#4b6b73">USER</text>
    <text x="90" y="38" fill="#bae6fd">Roshan Yadav</text>

    <!-- Row: ALIAS -->
    <text x="0" y="60" fill="#4b6b73">ALIAS</text>
    <text x="90" y="60" fill="#7dd3fc" font-weight="700">KYROS</text>

    <!-- Row: ROLE -->
    <text x="0" y="82" fill="#4b6b73">ROLE</text>
    <text x="90" y="82" fill="#7dd3fc">AI Engineer</text>

    <!-- Row: FOCUS -->
    <text x="0" y="104" fill="#4b6b73">FOCUS</text>
    <text x="90" y="104" fill="#7dd3fc">AI &amp; Quantum</text>

    <!-- Divider -->
    <line x1="0" y1="122" x2="300" y2="122" stroke="#1a2f38" stroke-width="0.8"/>

    <!-- Row: LEARNING -->
    <text x="0" y="148" fill="#4b6b73">LEARNING</text>
    <text x="90" y="148" fill="#bae6fd">ML · DL · LLM · RAG</text>

    <!-- Row: BUILDING -->
    <text x="0" y="170" fill="#4b6b73">BUILDING</text>
    <text x="90" y="170" fill="#bae6fd">AI Agents &amp; Systems</text>

    <!-- Row: STACK -->
    <text x="0" y="192" fill="#4b6b73">STACK</text>
    <text x="90" y="192" fill="#bae6fd">Python · PyTorch · FastAPI</text>

    <!-- Row: VECTORS -->
    <text x="0" y="214" fill="#4b6b73">VECTORS</text>
    <text x="90" y="214" fill="#bae6fd">Qdrant · Embeddings</text>

    <!-- Row: INTERESTS -->
    <text x="0" y="236" fill="#4b6b73">INTERESTS</text>
    <text x="90" y="236" fill="#bae6fd">NLP · Agents · GenAI</text>

  </g>

  <!-- ==================== COLOR PALETTE ==================== -->
  <g transform="translate(630 350)">
    <rect x="0"   y="0" width="42" height="6" rx="1" fill="#22d3ee"/>
    <rect x="48"  y="0" width="42" height="6" rx="1" fill="#0891b2"/>
    <rect x="96"  y="0" width="42" height="6" rx="1" fill="#7dd3fc"/>
    <rect x="144" y="0" width="42" height="6" rx="1" fill="#bae6fd"/>
    <rect x="192" y="0" width="42" height="6" rx="1" fill="#4b6b73"/>
  </g>

  <!-- ==================== BOTTOM STATUS BAR ==================== -->
  <line x1="30" y1="395" x2="970" y2="395" stroke="#1a2f38" stroke-width="0.8"/>

  <rect x="30" y="404" width="8" height="12" fill="#22d3ee" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="46" y="414" font-size="10" fill="#4b6b73" letter-spacing="1">
    system_ready · build_deeply · learn_continuously
  </text>

  <text x="970" y="414" text-anchor="end" font-size="10" fill="#2a4650" letter-spacing="1">
    2026 · AI LAB
  </text>

  <!-- ==================== ANIMATED ELEMENTS ==================== -->

  <!-- Corner brackets -->
  <path d="M20 30 L20 20 L30 20" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <path d="M980 30 L980 20 L970 20" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <path d="M20 400 L20 410 L30 410" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <path d="M980 400 L980 410 L970 410" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>

  <!-- Scanning line -->
  <rect x="8" y="50" width="984" height="1" fill="#22d3ee" opacity="0.08">
    <animate attributeName="y" values="50;415;50" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.12;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Data stream particles on right edge -->
  <g opacity="0.5">
    <rect x="985" y="100" width="1.5" height="30" fill="url(#stream)">
      <animate attributeName="y" values="80;380;80" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="988" y="150" width="1.5" height="20" fill="url(#stream)">
      <animate attributeName="y" values="150;400;150" dur="9s" repeatCount="indefinite" begin="1s"/>
    </rect>
  </g>

</svg>